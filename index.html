<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

    <title>Webly</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }
    </style>
</head>

<body>

<script>
"use strict";

/*
    WEBLY RUNTIME

    This runtime does not contain Webly keywords such as:

        button
        page
        wait
        function
        repeat
        if
        clicked

    Those come from syntax.json.

    The runtime only understands generic definition types
    described by syntax.json.
*/

class WeblyRuntime {

    constructor(syntax) {
        this.syntax = syntax || {};

        this.definitions = [];

        this.variables = {};
        this.functions = {};

        this.elements = {};

        this.running = false;

        this.collectDefinitions(this.syntax);
    }


    /* ---------------------------------------------------------
       SYNTAX DEFINITIONS
    --------------------------------------------------------- */

    collectDefinitions(value) {

        if (!value || typeof value !== "object") {
            return;
        }

        if (Array.isArray(value)) {

            for (const item of value) {
                this.collectDefinitions(item);
            }

            return;
        }

        if (
            typeof value.type === "string" &&
            (
                typeof value.webly === "string" ||
                typeof value.original === "string"
            )
        ) {
            this.definitions.push(value);
        }

        for (const key of Object.keys(value)) {

            if (
                key === "webly" ||
                key === "original"
            ) {
                continue;
            }

            this.collectDefinitions(value[key]);
        }
    }


    /* ---------------------------------------------------------
       PLACEHOLDER PARSING
    --------------------------------------------------------- */

    escapeRegex(text) {

        return text.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        );
    }


    templateToRegex(template) {

        const placeholders = [];

        let pattern = "";
        let last = 0;

        const expression = /\{([A-Za-z_][A-Za-z0-9_]*)\}/g;

        let match;

        while ((match = expression.exec(template)) !== null) {

            pattern += this.escapeRegex(
                template.slice(last, match.index)
            );

            const name = match[1];

            placeholders.push(name);

            /*
                Values are intentionally broad here.

                The definition itself determines what the
                resulting value means.
            */

            pattern += "([\\s\\S]*?)";

            last = match.index + match[0].length;
        }

        pattern += this.escapeRegex(
            template.slice(last)
        );

        return {
            regex: new RegExp(
                "^\\s*" + pattern + "\\s*$"
            ),
            placeholders
        };
    }


    matchDefinition(line, definition) {

        if (!definition.webly) {
            return null;
        }

        const {
            regex,
            placeholders
        } = this.templateToRegex(
            definition.webly
        );

        const match = line.match(regex);

        if (!match) {
            return null;
        }

        const values = {};

        placeholders.forEach(
            (name, index) => {
                values[name] = match[index + 1];
            }
        );

        return values;
    }


    findDefinition(line) {

        for (const definition of this.definitions) {

            const values = this.matchDefinition(
                line,
                definition
            );

            if (values) {

                return {
                    definition,
                    values
                };
            }
        }

        return null;
    }


    /* ---------------------------------------------------------
       VALUE RESOLUTION
    --------------------------------------------------------- */

    resolveValue(value, locals = {}) {

        if (value === undefined || value === null) {
            return value;
        }

        value = String(value).trim();

        /*
            Strings
        */

        if (
            value.length >= 2 &&
            (
                (
                    value.startsWith('"') &&
                    value.endsWith('"')
                ) ||
                (
                    value.startsWith("'") &&
                    value.endsWith("'")
                )
            )
        ) {
            return value.slice(
                1,
                -1
            );
        }


        /*
            Boolean
        */

        if (value === "true") {
            return true;
        }

        if (value === "false") {
            return false;
        }


        /*
            Null
        */

        if (value === "null") {
            return null;
        }


        /*
            Number
        */

        if (
            /^-?(?:\d+\.?\d*|\.\d+)$/.test(value)
        ) {
            return Number(value);
        }


        /*
            Local variable
        */

        if (
            Object.prototype.hasOwnProperty.call(
                locals,
                value
            )
        ) {
            return locals[value];
        }


        /*
            Global variable
        */

        if (
            Object.prototype.hasOwnProperty.call(
                this.variables,
                value
            )
        ) {
            return this.variables[value];
        }


        /*
            Simple arithmetic.

            This allows things such as:

                score + 1
                wait * 2
                x - 5
        */

        if (
            /^[A-Za-z0-9_.$\s+\-*/%()]+$/.test(value)
        ) {

            const names = Object.keys({
                ...this.variables,
                ...locals
            });

            if (
                names.some(
                    name =>
                        value === name ||
                        value.includes(name)
                )
            ) {

                try {

                    const scope = {
                        ...this.variables,
                        ...locals
                    };

                    const keys = Object.keys(scope);
                    const vals = Object.values(scope);

                    const fn = new Function(
                        ...keys,
                        `"use strict"; return (${value});`
                    );

                    return fn(...vals);

                } catch {
                    /* Fall through */
                }
            }
        }

        return value;
    }


    /* ---------------------------------------------------------
       ASSIGNMENT
    --------------------------------------------------------- */

    executeAssignment(values, locals) {

        const name = String(
            values.name || ""
        ).trim();

        const operator = String(
            values.operator || "="
        ).trim();

        const rawValue = values.value;

        if (!name) {
            return;
        }

        const value = this.resolveValue(
            rawValue,
            locals
        );


        if (operator === "=") {

            if (locals) {
                locals[name] = value;
            } else {
                this.variables[name] = value;
            }

            return;
        }


        const current =
            locals &&
            Object.prototype.hasOwnProperty.call(
                locals,
                name
            )
                ? locals[name]
                : this.variables[name];


        let result;

        switch (operator) {

            case "+=":
                result = current + value;
                break;

            case "-=":
                result = current - value;
                break;

            case "*=":
                result = current * value;
                break;

            case "/=":
                result = current / value;
                break;

            case "%=":
                result = current % value;
                break;

            default:
                result = value;
        }


        if (locals) {
            locals[name] = result;
        } else {
            this.variables[name] = result;
        }
    }


    /* ---------------------------------------------------------
       ELEMENTS
    --------------------------------------------------------- */

    createElement(values, definition) {

        const type =
            values.type ||
            definition.tag ||
            "div";

        const name =
            this.resolveValue(
                values.name
            );

        if (!name) {
            return;
        }

        const element =
            document.createElement(
                String(type)
            );

        element.id = String(name);

        document.body.appendChild(
            element
        );

        this.elements[String(name)] =
            element;
    }


    getElement(name) {

        name = this.resolveValue(name);

        if (
            this.elements[
                String(name)
            ]
        ) {
            return this.elements[
                String(name)
            ];
        }

        return document.getElementById(
            String(name)
        );
    }


    /* ---------------------------------------------------------
       PROPERTY
    --------------------------------------------------------- */

    executeProperty(
        values,
        definition,
        locals
    ) {

        const targetName =
            this.resolveValue(
                values.target ||
                values.element ||
                definition.target,
                locals
            );

        const property =
            definition.property ||
            definition.name;

        const value =
            this.resolveValue(
                values.value,
                locals
            );


        /*
            page/body-style properties
        */

        if (
            definition.target === "page" ||
            targetName === "page"
        ) {

            const body = document.body;

            if (property) {

                if (
                    property === "background"
                ) {
                    body.style.background =
                        value;
                    return;
                }

                if (
                    property === "color"
                ) {
                    body.style.color =
                        value;
                    return;
                }
            }
        }


        const element =
            this.getElement(
                targetName
            );

        if (!element) {
            return;
        }


        if (property) {

            if (
                property in element.style
            ) {

                element.style[property] =
                    value;

                return;
            }

            element[property] =
                value;
        }
    }


    /* ---------------------------------------------------------
       STYLE
    --------------------------------------------------------- */

    executeStyle(
        values,
        definition,
        locals
    ) {

        const elementName =
            this.resolveValue(
                values.element,
                locals
            );

        const element =
            this.getElement(
                elementName
            );

        if (!element) {
            return;
        }

        const property =
            definition.property;

        const value =
            this.resolveValue(
                values.value,
                locals
            );

        if (property) {

            element.style[property] =
                value;
        }
    }


    /* ---------------------------------------------------------
       ACTION
    --------------------------------------------------------- */

    executeAction(
        values,
        definition,
        locals
    ) {

        const elementName =
            this.resolveValue(
                values.element,
                locals
            );

        const element =
            this.getElement(
                elementName
            );

        if (!element) {
            return;
        }


        const action =
            definition.action;


        /*
            The action definition determines
            the native operation.
        */

        if (
            action === "style.display" &&
            definition.value !== undefined
        ) {

            element.style.display =
                definition.value;

            return;
        }


        if (
            action in element &&
            typeof element[action] === "function"
        ) {

            element[action]();

            return;
        }


        if (
            action in element
        ) {

            element[action] =
                definition.value;
        }
    }


    /* ---------------------------------------------------------
       TIMING
    --------------------------------------------------------- */

    async executeTiming(
        values,
        definition,
        locals
    ) {

        const seconds =
            Number(
                this.resolveValue(
                    values.seconds,
                    locals
                )
            );

        if (
            !Number.isFinite(seconds)
        ) {
            return;
        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    Math.max(
                        0,
                        seconds * 1000
                    )
                )
        );
    }


    /* ---------------------------------------------------------
       FUNCTIONS
    --------------------------------------------------------- */

    registerFunction(
        values,
        body
    ) {

        const name =
            String(
                values.name || ""
            ).trim();

        if (!name) {
            return;
        }

        this.functions[name] = {
            body
        };
    }


    async callFunction(
        name,
        locals = {}
    ) {

        name = String(name).trim();

        const fn =
            this.functions[name];

        if (!fn) {

            throw new Error(
                `Webly function not found: ${name}`
            );
        }

        await this.executeBlock(
            fn.body,
            locals
        );
    }


    /* ---------------------------------------------------------
       CONTROL FLOW
    --------------------------------------------------------- */

    evaluateCondition(
        condition,
        locals
    ) {

        condition =
            String(condition)
                .trim();


        /*
            Basic negation
        */

        if (
            condition.startsWith("not ")
        ) {

            return !this.evaluateCondition(
                condition.slice(4),
                locals
            );
        }


        const scope = {
            ...this.variables,
            ...locals
        };


        try {

            const keys =
                Object.keys(scope);

            const vals =
                Object.values(scope);


            const fn =
                new Function(
                    ...keys,
                    `"use strict"; return (${condition});`
                );

            return Boolean(
                fn(...vals)
            );

        } catch {

            return Boolean(
                this.resolveValue(
                    condition,
                    locals
                )
            );
        }
    }


    async executeControl(
        values,
        definition,
        body,
        locals
    ) {

        const condition =
            values.condition;


        if (
            definition.control === "if"
        ) {

            if (
                this.evaluateCondition(
                    condition,
                    locals
                )
            ) {

                await this.executeBlock(
                    body,
                    locals
                );
            }
        }
    }


    /* ---------------------------------------------------------
       NATIVE
    --------------------------------------------------------- */

    executeNative(
        values,
        definition,
        locals
    ) {

        if (
            !definition.original
        ) {
            return;
        }

        /*
            Native definitions are executed only
            when explicitly represented by syntax.json.
        */

        let code =
            definition.original;


        for (
            const [key, value]
            of Object.entries(values)
        ) {

            const resolved =
                this.resolveValue(
                    value,
                    locals
                );


            const safe =
                typeof resolved === "string"
                    ? JSON.stringify(resolved)
                    : String(resolved);


            code =
                code.replace(
                    new RegExp(
                        "\\{" +
                        this.escapeRegex(key) +
                        "\\}",
                        "g"
                    ),
                    safe
                );
        }


        try {

            const fn =
                new Function(
                    code
                );

            return fn();

        } catch (error) {

            console.error(
                "Webly native execution error:",
                error
            );
        }
    }


    /* ---------------------------------------------------------
       EVENTS
    --------------------------------------------------------- */

    registerEvent(
        values,
        definition,
        body,
        locals
    ) {

        const elementName =
            this.resolveValue(
                values.element,
                locals
            );

        const element =
            this.getElement(
                elementName
            );

        if (!element) {
            return;
        }

        const eventName =
            definition.event;

        if (!eventName) {
            return;
        }


        element.addEventListener(
            eventName,
            async () => {

                try {

                    await this.executeBlock(
                        body,
                        {
                            ...locals
                        }
                    );

                } catch (error) {

                    this.error(
                        error
                    );
                }
            }
        );
    }


    /* ---------------------------------------------------------
       BLOCK PARSING
    --------------------------------------------------------- */

    extractBlocks(source) {

        const lines =
            source.split(/\r?\n/);

        const result = [];

        let i = 0;

        while (
            i < lines.length
        ) {

            const raw =
                lines[i];

            const line =
                raw.trim();


            if (!line) {
                i++;
                continue;
            }


            /*
                A line ending in {
                starts a block.
            */

            if (
                line.endsWith("{")
            ) {

                const header =
                    line.slice(
                        0,
                        -1
                    ).trim();


                const body = [];

                let depth = 1;

                i++;


                while (
                    i < lines.length &&
                    depth > 0
                ) {

                    const current =
                        lines[i];

                    const trimmed =
                        current.trim();


                    /*
                        Count braces while respecting
                        simple quoted strings.
                    */

                    const opens =
                        this.countCharacter(
                            current,
                            "{"
                        );

                    const closes =
                        this.countCharacter(
                            current,
                            "}"
                        );


                    if (
                        depth === 1 &&
                        trimmed === "}"
                    ) {

                        depth--;

                        i++;

                        break;
                    }


                    body.push(
                        current
                    );


                    depth +=
                        opens -
                        closes;


                    i++;
                }


                result.push({
                    kind: "block",
                    header,
                    body: body.join("\n")
                });

                continue;
            }


            result.push({
                kind: "line",
                line
            });

            i++;
        }

        return result;
    }


    countCharacter(
        text,
        character
    ) {

        let count = 0;

        let quote = null;

        for (
            let i = 0;
            i < text.length;
            i++
        ) {

            const char =
                text[i];

            if (
                quote
            ) {

                if (
                    char === quote &&
                    text[i - 1] !== "\\"
                ) {
                    quote = null;
                }

                continue;
            }


            if (
                char === '"' ||
                char === "'"
            ) {

                quote = char;

                continue;
            }


            if (
                char === character
            ) {
                count++;
            }
        }

        return count;
    }


    /* ---------------------------------------------------------
       BLOCK EXECUTION
    --------------------------------------------------------- */

    async executeBlock(
        source,
        locals = {}
    ) {

        const entries =
            this.extractBlocks(
                source
            );


        for (
            const entry
            of entries
        ) {

            if (
                entry.kind === "block"
            ) {

                await this.executeBlockEntry(
                    entry,
                    locals
                );

            } else {

                await this.executeLine(
                    entry.line,
                    locals
                );
            }
        }
    }


    async executeBlockEntry(
        entry,
        locals
    ) {

        const header =
            entry.header;


        /*
            FIRST: check function declarations.

            This is important.

            "function flash()" is a declaration,
            while "flash()" is a call.

            They must never be treated as the same thing.
        */

        const functionDefinition =
            this.findDefinition(
                header + " {"
            );


        if (
            functionDefinition &&
            functionDefinition.definition.type ===
                "function"
        ) {

            this.registerFunction(
                functionDefinition.values,
                entry.body
            );

            return;
        }


        /*
            Generic definition matching.
        */

        const matched =
            this.findDefinition(
                header + " {"
            );


        if (!matched) {

            /*
                Some syntax definitions may represent
                their block without requiring the {.
            */

            const alternate =
                this.findDefinition(
                    header
                );

            if (
                alternate
            ) {

                await this.executeMatchedDefinition(
                    alternate,
                    entry.body,
                    locals
                );

                return;
            }


            throw new Error(
                `Webly syntax not found: ${header}`
            );
        }


        await this.executeMatchedDefinition(
            matched,
            entry.body,
            locals
        );
    }


    async executeMatchedDefinition(
        matched,
        body,
        locals
    ) {

        const {
            definition,
            values
        } = matched;


        switch (
            definition.type
        ) {

            case "function":

                this.registerFunction(
                    values,
                    body
                );

                return;


            case "event":

                this.registerEvent(
                    values,
                    definition,
                    body,
                    locals
                );

                return;


            case "control":

                await this.executeControl(
                    values,
                    definition,
                    body,
                    locals
                );

                return;


            case "loop":

                await this.executeLoop(
                    values,
                    definition,
                    body,
                    locals
                );

                return;


            default:

                /*
                    A block can also be represented
                    by a native definition.
                */

                this.executeNative(
                    values,
                    definition,
                    locals
                );
        }
    }


    /* ---------------------------------------------------------
       LOOPS
    --------------------------------------------------------- */

    async executeLoop(
        values,
        definition,
        body,
        locals
    ) {

        /*
            A repeat-forever definition can describe
            the loop in syntax.json.

            The runtime does not need the actual
            Webly spelling of the loop.
        */

        if (
            definition.repeat === "forever"
        ) {

            while (true) {

                await this.executeBlock(
                    body,
                    locals
                );

                /*
                    Yield to the browser so an infinite
                    loop does not completely block rendering.
                */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            0
                        )
                );
            }
        }
    }


    /* ---------------------------------------------------------
       LINES
    --------------------------------------------------------- */

    async executeLine(
        line,
        locals = {}
    ) {

        line =
            line.trim();


        if (!line) {
            return;
        }


        /*
            Ignore standalone closing braces.
        */

        if (
            line === "}"
        ) {
            return;
        }


        const matched =
            this.findDefinition(
                line
            );


        if (!matched) {

            throw new Error(
                `Webly syntax not found: ${line}`
            );
        }


        await this.executeDefinition(
            matched.definition,
            matched.values,
            locals
        );
    }


    /* ---------------------------------------------------------
       DEFINITION EXECUTION
    --------------------------------------------------------- */

    async executeDefinition(
        definition,
        values,
        locals
    ) {

        switch (
            definition.type
        ) {

            case "assignment":

                this.executeAssignment(
                    values,
                    locals
                );

                return;


            case "property":

                this.executeProperty(
                    values,
                    definition,
                    locals
                );

                return;


            case "style":

                this.executeStyle(
                    values,
                    definition,
                    locals
                );

                return;


            case "action":

                this.executeAction(
                    values,
                    definition,
                    locals
                );

                return;


            case "element":

                this.createElement(
                    values,
                    definition
                );

                return;


            case "timing":

                await this.executeTiming(
                    values,
                    definition,
                    locals
                );

                return;


            case "call":

                await this.callFunction(
                    values.name,
                    locals
                );

                return;


            case "native":

                this.executeNative(
                    values,
                    definition,
                    locals
                );

                return;


            default:

                /*
                    Generic fallback.

                    If syntax.json supplies a native
                    implementation, it can still be run.
                */

                if (
                    definition.original
                ) {

                    this.executeNative(
                        values,
                        definition,
                        locals
                    );

                    return;
                }


                throw new Error(
                    `Unsupported Webly definition type: ${definition.type}`
                );
        }
    }


    /* ---------------------------------------------------------
       START
    --------------------------------------------------------- */

    async run(
        source
    ) {

        if (this.running) {
            return;
        }

        this.running = true;

        try {

            await this.executeBlock(
                source,
                {}
            );

        } catch (error) {

            this.error(
                error
            );
        }
    }


    /* ---------------------------------------------------------
       ERROR
    --------------------------------------------------------- */

    error(error) {

        console.error(
            "Webly Runtime Error",
            error
        );

        const message =
            document.createElement(
                "pre"
            );

        message.textContent =
            "Webly Runtime Error\n\n" +
            error.message;

        message.style.position =
            "fixed";

        message.style.left =
            "10px";

        message.style.right =
            "10px";

        message.style.bottom =
            "10px";

        message.style.padding =
            "15px";

        message.style.margin =
            "0";

        message.style.background =
            "#181721";

        message.style.color =
            "#ffffff";

        message.style.border =
            "1px solid #444";

        message.style.borderRadius =
            "8px";

        message.style.zIndex =
            "999999";

        document.body.appendChild(
            message
        );
    }
}


/* =============================================================
   FILE LOADING
============================================================= */

async function loadJSON(
    path
) {

    const response =
        await fetch(path);

    if (!response.ok) {

        throw new Error(
            `Could not load ${path}`
        );
    }

    return await response.json();
}


async function loadText(
    path
) {

    const response =
        await fetch(path);

    if (!response.ok) {

        throw new Error(
            `Could not load ${path}`
        );
    }

    return await response.text();
}


/* =============================================================
   WEBLY STARTUP
============================================================= */

async function startWebly() {

    try {

        const syntax =
            await loadJSON(
                "syntax.json"
            );

        const source =
            await loadText(
                "main.webly"
            );


        const runtime =
            new WeblyRuntime(
                syntax
            );


        window.Webly =
            runtime;


        await runtime.run(
            source
        );

    } catch (error) {

        console.error(
            "Webly startup error:",
            error
        );
    }
}


startWebly();

</script>
