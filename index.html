<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webly Runtime</title>
</head>

<body>

<script>
const elements = {};
const functions = {};
const variables = {};


/* =========================
   PAGE
========================= */

const page = {
    set background(value) {
        document.body.style.background = value;
    },

    get background() {
        return document.body.style.background;
    }
};


/* =========================
   ELEMENT CREATION
========================= */

function createElement(type, name) {
    let element;

    switch (type) {
        case "button":
            element = document.createElement("button");
            break;

        case "label":
            element = document.createElement("div");
            break;

        case "input":
            element = document.createElement("input");
            break;

        case "text":
            element = document.createElement("span");
            break;

        case "box":
            element = document.createElement("div");
            break;

        default:
            element = document.createElement("div");
    }

    element.dataset.weblyName = name;

    document.body.appendChild(element);

    elements[name] = element;

    return element;
}


/* =========================
   PROPERTY SYSTEM
========================= */

function setProperty(element, property, value) {
    if (!element) return;

    switch (property) {

        case "text":
            element.textContent = value;
            break;

        case "color":
            element.style.color = value;
            break;

        case "background":
            element.style.background = value;
            break;

        case "width":
            element.style.width =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        case "height":
            element.style.height =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        case "radius":
            element.style.borderRadius =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        case "fontSize":
            element.style.fontSize =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        case "padding":
            element.style.padding =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        case "display":
            element.style.display = value;
            break;

        case "direction":
            element.style.flexDirection = value;
            break;

        case "align":
            element.style.alignItems = value;
            break;

        case "justify":
            element.style.justifyContent = value;
            break;

        case "gap":
            element.style.gap =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        case "scale":
            element.style.transform =
                `scale(${value})`;
            break;

        case "hidden":
            element.style.display =
                value ? "none" : "";
            break;

        case "position":
            element.style.position = value;
            break;

        case "top":
            element.style.top =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        case "left":
            element.style.left =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        case "right":
            element.style.right =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        case "bottom":
            element.style.bottom =
                typeof value === "number"
                    ? value + "px"
                    : value;
            break;

        default:
            element.style[property] = value;
    }
}


/* =========================
   ACTIONS
========================= */

function runAction(element, action) {
    if (!element) return;

    switch (action) {

        case "hide":
            element.style.display = "none";
            break;

        case "show":
            element.style.display = "";
            break;

        case "disable":
            element.disabled = true;
            break;

        case "enable":
            element.disabled = false;
            break;
    }
}


/* =========================
   WAIT
========================= */

function wait(seconds) {
    return new Promise(resolve => {
        setTimeout(resolve, seconds * 1000);
    });
}


/* =========================
   VALUE PARSER
========================= */

function parseValue(
    value,
    localElements = {},
    localVariables = {}
) {

    value = value.trim();


    /* STRING */

    if (
        (value.startsWith('"') && value.endsWith('"')) ||
        (value.startsWith("'") && value.endsWith("'"))
    ) {
        return value.slice(1, -1);
    }


    /* BOOLEAN */

    if (value === "true") return true;
    if (value === "false") return false;


    /* NUMBER */

    if (value !== "" && !isNaN(Number(value))) {
        return Number(value);
    }


    /* LOCAL VARIABLE */

    if (
        Object.prototype.hasOwnProperty.call(
            localVariables,
            value
        )
    ) {
        return localVariables[value];
    }


    /* GLOBAL VARIABLE */

    if (
        Object.prototype.hasOwnProperty.call(
            variables,
            value
        )
    ) {
        return variables[value];
    }


    /* LOCAL ELEMENT */

    if (localElements[value]) {
        return localElements[value];
    }


    /* GLOBAL ELEMENT */

    if (elements[value]) {
        return elements[value];
    }


    return value;
}


/* =========================
   VARIABLE ASSIGNMENT
========================= */

function setVariable(
    name,
    value,
    localVariables = null
) {

    if (localVariables) {
        localVariables[name] = value;
    } else {
        variables[name] = value;
    }
}


/* =========================
   GET VARIABLE
========================= */

function getVariable(
    name,
    localVariables = {}
) {

    if (
        Object.prototype.hasOwnProperty.call(
            localVariables,
            name
        )
    ) {
        return localVariables[name];
    }

    if (
        Object.prototype.hasOwnProperty.call(
            variables,
            name
        )
    ) {
        return variables[name];
    }

    return undefined;
}


/* =========================
   EXECUTE LINE
========================= */

async function executeLine(
    line,
    localElements = {},
    localVariables = {}
) {

    line = line.trim();

    if (!line) return;


    /* =========================
       WAIT
    ========================= */

    const waitMatch = line.match(
        /^wait\s*\(\s*(.*?)\s*\)$/
    );

    if (waitMatch) {

        const seconds = Number(
            parseValue(
                waitMatch[1],
                localElements,
                localVariables
            )
        );

        await wait(seconds);

        return;
    }


    /* =========================
       PAGE PROPERTY
    ========================= */

    const pageMatch = line.match(
        /^page\.(background)\s*=\s*(.+)$/
    );

    if (pageMatch) {

        const property = pageMatch[1];

        const value = parseValue(
            pageMatch[2],
            localElements,
            localVariables
        );

        page[property] = value;

        return;
    }


    /* =========================
       ELEMENT CREATE
    ========================= */

    const createMatch = line.match(
        /^(\w+)\.create\(["'](.+)["']\)$/
    );

    if (createMatch) {

        const type = createMatch[1];
        const name = createMatch[2];

        createElement(type, name);

        return;
    }


    /* =========================
       ELEMENT ACTION
    ========================= */

    const actionMatch = line.match(
        /^(\w+)\.(hide|show|disable|enable)$/
    );

    if (actionMatch) {

        const name = actionMatch[1];
        const action = actionMatch[2];

        const element =
            localElements[name] ||
            elements[name];

        runAction(element, action);

        return;
    }


    /* =========================
       ELEMENT +=
    ========================= */

    const addMatch = line.match(
        /^(\w+)\.(\w+)\s*\+=\s*(.+)$/
    );

    if (addMatch) {

        const name = addMatch[1];
        const property = addMatch[2];

        const value = parseValue(
            addMatch[3],
            localElements,
            localVariables
        );

        const element =
            localElements[name] ||
            elements[name];

        if (!element) return;

        if (property === "text") {

            element.textContent += value;

        } else {

            const current =
                Number(element[property] || 0);

            setProperty(
                element,
                property,
                current + Number(value)
            );
        }

        return;
    }


    /* =========================
       ELEMENT PROPERTY =
    ========================= */

    const assignmentMatch = line.match(
        /^(\w+)\.(\w+)\s*=\s*(.+)$/
    );

    if (assignmentMatch) {

        const name = assignmentMatch[1];
        const property = assignmentMatch[2];

        const element =
            localElements[name] ||
            elements[name];

        if (!element) return;

        const value = parseValue(
            assignmentMatch[3],
            localElements,
            localVariables
        );

        setProperty(
            element,
            property,
            value
        );

        return;
    }


    /* =========================
       VARIABLE +=
    ========================= */

    const variableMathMatch = line.match(
        /^(\w+)\s*(\+=|-=|\*=|\/=)\s*(.+)$/
    );

    if (variableMathMatch) {

        const name = variableMathMatch[1];
        const operator = variableMathMatch[2];

        const value = parseValue(
            variableMathMatch[3],
            localElements,
            localVariables
        );

        let current = getVariable(
            name,
            localVariables
        );

        if (current === undefined) {
            current = 0;
        }

        switch (operator) {

            case "+=":
                current += value;
                break;

            case "-=":
                current -= value;
                break;

            case "*=":
                current *= value;
                break;

            case "/=":
                current /= value;
                break;
        }

        setVariable(
            name,
            current,
            localVariables
        );

        return;
    }


    /* =========================
       VARIABLE =
    ========================= */

    const variableMatch = line.match(
        /^(\w+)\s*=\s*(.+)$/
    );

    if (variableMatch) {

        const name = variableMatch[1];

        const value = parseValue(
            variableMatch[2],
            localElements,
            localVariables
        );

        setVariable(
            name,
            value,
            localVariables
        );

        return;
    }
}


/* =========================
   EXECUTE BLOCK
========================= */

async function executeBlock(
    body,
    localElements = {},
    localVariables = {}
) {

    const lines =
        body
            .split("\n")
            .map(line => line.trim())
            .filter(line => line);

    for (const line of lines) {

        await executeLine(
            line,
            localElements,
            localVariables
        );
    }
}


/* =========================
   REPEAT FOREVER
========================= */

async function executeForever(
    body,
    localElements = {},
    localVariables = {}
) {

    while (true) {

        await executeBlock(
            body,
            localElements,
            localVariables
        );
    }
}


/* =========================
   FUNCTION BODY
========================= */

async function executeFunctionBody(
    body,
    localElements,
    localVariables
) {

    const lines = body.split("\n");

    let i = 0;

    while (i < lines.length) {

        const line = lines[i].trim();

        if (!line) {
            i++;
            continue;
        }


        /* REPEAT FOREVER */

        if (
            line === "repeat forever {" ||
            line === "repeat forever{"
        ) {

            let depth = 1;
            const block = [];

            i++;

            while (
                i < lines.length &&
                depth > 0
            ) {

                const current =
                    lines[i].trim();

                if (
                    current.endsWith("{")
                ) {
                    depth++;
                }

                if (current === "}") {

                    depth--;

                    if (depth === 0) {
                        break;
                    }
                }

                if (depth > 0) {
                    block.push(lines[i]);
                }

                i++;
            }

            executeForever(
                block.join("\n"),
                localElements,
                localVariables
            );

            i++;

            continue;
        }


        await executeLine(
            line,
            localElements,
            localVariables
        );

        i++;
    }
}


/* =========================
   FUNCTION CALL
========================= */

async function callFunction(name, args) {

    const fn = functions[name];

    if (!fn) return;

    const localElements = {};
    const localVariables = {};


    for (
        let i = 0;
        i < fn.params.length;
        i++
    ) {

        const parameter =
            fn.params[i];

        const argument =
            args[i];

        const value =
            parseValue(
                argument,
                {},
                variables
            );

        if (elements[argument]) {

            localElements[parameter] =
                elements[argument];

        } else {

            localVariables[parameter] =
                value;
        }
    }


    await executeFunctionBody(
        fn.body,
        localElements,
        localVariables
    );
}


/* =========================
   WEBLY PARSER
========================= */

async function runWebly(code) {

    const lines = code.split("\n");

    let i = 0;

    while (i < lines.length) {

        const line = lines[i].trim();

        if (!line) {
            i++;
            continue;
        }


        /* =========================
           FUNCTION
        ========================= */

        const functionMatch =
            line.match(
                /^function\s+(\w+)\s*\((.*?)\)\s*\{$/
            );

        if (functionMatch) {

            const name =
                functionMatch[1];

            const params =
                functionMatch[2]
                    .split(",")
                    .map(x => x.trim())
                    .filter(Boolean);

            let depth = 1;
            const body = [];

            i++;

            while (
                i < lines.length &&
                depth > 0
            ) {

                const current =
                    lines[i].trim();

                if (
                    current.endsWith("{")
                ) {
                    depth++;
                }

                if (current === "}") {

                    depth--;

                    if (depth === 0) {
                        break;
                    }
                }

                if (depth > 0) {
                    body.push(lines[i]);
                }

                i++;
            }

            functions[name] = {
                params,
                body: body.join("\n")
            };

            i++;

            continue;
        }


        /* =========================
           FUNCTION CALL
        ========================= */

        const callMatch =
            line.match(
                /^(\w+)\s*\((.*?)\)$/
            );

        if (callMatch) {

            const name =
                callMatch[1];

            const args =
                callMatch[2]
                    .split(",")
                    .map(x => x.trim())
                    .filter(Boolean);

            await callFunction(
                name,
                args
            );

            i++;

            continue;
        }


        /* =========================
           NORMAL LINE
        ========================= */

        await executeLine(
            line,
            {},
            {}
        );

        i++;
    }
}


/* =========================
   LOAD MAIN.WEBLY
========================= */

async function loadWebly() {

    try {

        const response =
            await fetch("main.webly");

        if (!response.ok) {
            throw new Error(
                "Could not load main.webly"
            );
        }

        const code =
            await response.text();

        await runWebly(code);

    } catch (error) {

        console.error(
            "Webly runtime error:",
            error
        );
    }
}


loadWebly();
</script>

</body>
</html>
