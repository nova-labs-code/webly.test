<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <title>Webly</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
        }
    </style>
</head>

<body>

<script>
"use strict";

/*
    Webly Runtime

    The runtime does not contain Webly's individual syntax definitions.
    Those are loaded from syntax.json.

    syntax.json describes:
        - elements
        - properties
        - styles
        - events
        - actions
        - assignments
        - functions
        - controls
        - timing
        - native operations

    The runtime only understands the generic operation types.
*/

class WeblyRuntime {

    constructor(syntax) {
        this.syntax = syntax;
        this.definitions = [];

        this.variables = Object.create(null);
        this.functions = Object.create(null);

        this.running = true;

        this.maxLoopIterations = 100000;
        this.maxCallDepth = 100;

        this.callDepth = 0;

        this.collectDefinitions(
            syntax && syntax.webly
                ? syntax.webly
                : syntax
        );
    }


    /* ---------------------------------------------------------
       SYNTAX DEFINITION COLLECTION
    --------------------------------------------------------- */

    collectDefinitions(value, path = []) {

        if (!value || typeof value !== "object") {
            return;
        }

        if (
            typeof value.type === "string" &&
            typeof value.webly === "string"
        ) {
            this.definitions.push({
                ...value,
                path: [...path]
            });
        }

        for (const [key, child] of Object.entries(value)) {

            if (
                key === "webly" &&
                typeof child === "object"
            ) {
                this.collectDefinitions(child, [...path, key]);
                continue;
            }

            if (
                child &&
                typeof child === "object"
            ) {
                this.collectDefinitions(child, [...path, key]);
            }
        }
    }


    getDefinitionsByType(type) {

        return this.definitions.filter(
            definition => definition.type === type
        );
    }


    /* ---------------------------------------------------------
       SOURCE PARSING
    --------------------------------------------------------- */

    parse(source) {

        const cleaned = this.cleanSource(source);

        return this.parseBlock(cleaned);
    }


    cleanSource(source) {

        let result = "";
        let quote = null;
        let escaped = false;
        let lineComment = false;
        let blockComment = false;

        for (let i = 0; i < source.length; i++) {

            const char = source[i];
            const next = source[i + 1];

            if (lineComment) {

                if (char === "\n") {
                    lineComment = false;
                    result += "\n";
                }

                continue;
            }

            if (blockComment) {

                if (char === "*" && next === "/") {
                    blockComment = false;
                    i++;
                }

                continue;
            }

            if (quote) {

                result += char;

                if (escaped) {
                    escaped = false;
                    continue;
                }

                if (char === "\\") {
                    escaped = true;
                    continue;
                }

                if (char === quote) {
                    quote = null;
                }

                continue;
            }

            if (
                char === '"' ||
                char === "'" ||
                char === "`"
            ) {
                quote = char;
                result += char;
                continue;
            }

            if (char === "/" && next === "/") {
                lineComment = true;
                i++;
                continue;
            }

            if (char === "/" && next === "*") {
                blockComment = true;
                i++;
                continue;
            }

            result += char;
        }

        return result;
    }


    parseBlock(source) {

        const nodes = [];

        let i = 0;

        while (i < source.length) {

            while (
                i < source.length &&
                /\s/.test(source[i])
            ) {
                i++;
            }

            if (i >= source.length) {
                break;
            }

            const start = i;

            let quote = null;
            let escaped = false;
            let parenDepth = 0;
            let bracketDepth = 0;

            let foundBrace = false;
            let braceIndex = -1;

            while (i < source.length) {

                const char = source[i];

                if (quote) {

                    if (escaped) {
                        escaped = false;
                        i++;
                        continue;
                    }

                    if (char === "\\") {
                        escaped = true;
                        i++;
                        continue;
                    }

                    if (char === quote) {
                        quote = null;
                    }

                    i++;
                    continue;
                }

                if (
                    char === '"' ||
                    char === "'" ||
                    char === "`"
                ) {
                    quote = char;
                    i++;
                    continue;
                }

                if (char === "(") {
                    parenDepth++;
                    i++;
                    continue;
                }

                if (char === ")") {
                    parenDepth--;
                    i++;
                    continue;
                }

                if (char === "[") {
                    bracketDepth++;
                    i++;
                    continue;
                }

                if (char === "]") {
                    bracketDepth--;
                    i++;
                    continue;
                }

                if (
                    char === "{" &&
                    parenDepth === 0 &&
                    bracketDepth === 0
                ) {

                    foundBrace = true;
                    braceIndex = i;
                    break;
                }

                if (
                    char === ";" &&
                    parenDepth === 0 &&
                    bracketDepth === 0
                ) {

                    const statement = source
                        .slice(start, i)
                        .trim();

                    if (statement) {
                        nodes.push({
                            type: "statement",
                            header: statement,
                            body: null
                        });
                    }

                    i++;
                    break;
                }

                if (
                    char === "\n" &&
                    parenDepth === 0 &&
                    bracketDepth === 0
                ) {

                    const statement = source
                        .slice(start, i)
                        .trim();

                    if (statement) {
                        nodes.push({
                            type: "statement",
                            header: statement,
                            body: null
                        });
                    }

                    i++;
                    break;
                }

                i++;
            }

            if (foundBrace) {

                const header = source
                    .slice(start, braceIndex)
                    .trim();

                const end = this.findMatchingBrace(
                    source,
                    braceIndex
                );

                if (end === -1) {
                    throw new Error(
                        `Unclosed block: ${header}`
                    );
                }

                const bodySource = source.slice(
                    braceIndex + 1,
                    end
                );

                nodes.push({
                    type: "block",
                    header,
                    body: this.parseBlock(bodySource)
                });

                i = end + 1;

                continue;
            }

            if (i >= source.length) {

                const statement = source
                    .slice(start)
                    .trim();

                if (statement) {
                    nodes.push({
                        type: "statement",
                        header: statement,
                        body: null
                    });
                }

                break;
            }
        }

        return nodes;
    }


    findMatchingBrace(source, start) {

        let depth = 0;
        let quote = null;
        let escaped = false;

        for (
            let i = start;
            i < source.length;
            i++
        ) {

            const char = source[i];

            if (quote) {

                if (escaped) {
                    escaped = false;
                    continue;
                }

                if (char === "\\") {
                    escaped = true;
                    continue;
                }

                if (char === quote) {
                    quote = null;
                }

                continue;
            }

            if (
                char === '"' ||
                char === "'" ||
                char === "`"
            ) {
                quote = char;
                continue;
            }

            if (char === "{") {
                depth++;
                continue;
            }

            if (char === "}") {

                depth--;

                if (depth === 0) {
                    return i;
                }
            }
        }

        return -1;
    }


    /* ---------------------------------------------------------
       TEMPLATE MATCHING
    --------------------------------------------------------- */

    templateToRegex(template) {

        let pattern = "";
        let i = 0;

        while (i < template.length) {

            if (
                template[i] === "{" &&
                template.slice(i).startsWith("{ ... }")
            ) {

                pattern += "[\\s\\S]*";
                i += "{ ... }".length;
                continue;
            }

            if (template[i] === "{") {

                const end = template.indexOf(
                    "}",
                    i + 1
                );

                if (end !== -1) {

                    const name = template.slice(
                        i + 1,
                        end
                    ).trim();

                    if (name) {

                        pattern +=
                            this.placeholderPattern(name);

                        i = end + 1;
                        continue;
                    }
                }
            }

            pattern += this.escapeRegex(
                template[i]
            );

            i++;
        }

        return new RegExp(
            "^\\s*" + pattern + "\\s*$",
            "s"
        );
    }


    placeholderPattern(name) {

        /*
            Identifier-like placeholders are restricted so that:

                {name} = {value}

            correctly matches:

                wait = 1

            instead of allowing {name} to consume
            the rest of the expression.
        */

        if (
            name === "name" ||
            name === "element" ||
            name === "target" ||
            name === "type"
        ) {
            return "([A-Za-z_$][A-Za-z0-9_$]*)";
        }

        if (name === "condition") {
            return "([\\s\\S]*?)";
        }

        if (
            name === "value" ||
            name === "seconds" ||
            name === "milliseconds" ||
            name === "amount" ||
            name === "url"
        ) {
            return "([\\s\\S]*?)";
        }

        return "([\\s\\S]*?)";
    }


    escapeRegex(value) {

        return value.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        );
    }


    matchDefinition(text) {

        const candidates = [];

        for (const definition of this.definitions) {

            let template = definition.webly;

            /*
                A definition such as:

                    function {name}() { ... }

                is matched against the block header:

                    function flash()

                so the outer block portion is removed.
            */

            if (template.includes("{ ... }")) {
                template = template
                    .replace(
                        /\s*\{\s*\.\.\.\s*\}\s*$/,
                        ""
                    )
                    .trim();
            }

            let regex;

            try {
                regex = this.templateToRegex(
                    template
                );
            } catch {
                continue;
            }

            const match = text.match(regex);

            if (!match) {
                continue;
            }

            const placeholders =
                this.extractPlaceholders(
                    template
                );

            const values = {};

            for (
                let i = 0;
                i < placeholders.length;
                i++
            ) {
                values[placeholders[i]] =
                    match[i + 1];
            }

            candidates.push({
                definition,
                values
            });
        }

        /*
            Prefer the most specific template.

            This is important because broad definitions such
            as assignments should not beat a more specific
            definition when one exists.
        */

        candidates.sort(
            (a, b) => {
                const aScore =
                    this.definitionSpecificity(
                        a.definition
                    );

                const bScore =
                    this.definitionSpecificity(
                        b.definition
                    );

                return bScore - aScore;
            }
        );

        return candidates[0] || null;
    }


    extractPlaceholders(template) {

        const result = [];

        const regex = /\{([^{}]+)\}/g;

        let match;

        while (
            (match = regex.exec(template)) !== null
        ) {

            const name = match[1].trim();

            if (name === "...") {
                continue;
            }

            result.push(name);
        }

        return result;
    }


    definitionSpecificity(definition) {

        let score = 0;

        const template = definition.webly;

        for (const char of template) {

            if (
                char !== "{" &&
                char !== "}"
            ) {
                score++;
            }
        }

        return score;
    }


    /* ---------------------------------------------------------
       VALUE SYSTEM
    --------------------------------------------------------- */

    resolveValue(value) {

        if (value === undefined || value === null) {
            return value;
        }

        let text = String(value).trim();

        /*
            Strings
        */

        if (
            (
                text.startsWith('"') &&
                text.endsWith('"')
            ) ||
            (
                text.startsWith("'") &&
                text.endsWith("'")
            )
        ) {

            return this.unquote(text);
        }

        /*
            Booleans
        */

        if (text === "true") {
            return true;
        }

        if (text === "false") {
            return false;
        }

        /*
            Null
        */

        if (text === "null") {
            return null;
        }

        /*
            Numeric values
        */

        if (
            /^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(text)
        ) {
            return Number(text);
        }

        /*
            Parenthesized expressions
        */

        if (
            text.startsWith("(") &&
            text.endsWith(")")
        ) {

            const inner = text.slice(
                1,
                -1
            );

            return this.evaluateExpression(
                inner
            );
        }

        /*
            Known variable
        */

        if (
            Object.prototype.hasOwnProperty.call(
                this.variables,
                text
            )
        ) {
            return this.variables[text];
        }

        /*
            Expression
        */

        if (
            this.looksLikeExpression(text)
        ) {

            try {
                return this.evaluateExpression(
                    text
                );
            } catch {
                return text;
            }
        }

        return text;
    }


    unquote(value) {

        if (value.length < 2) {
            return value;
        }

        const quote = value[0];

        if (
            value[value.length - 1] !== quote
        ) {
            return value;
        }

        try {
            if (quote === '"') {
                return JSON.parse(value);
            }
        } catch {}

        return value.slice(
            1,
            -1
        );
    }


    looksLikeExpression(value) {

        return (
            /[+\-*/%<>=!&|]/.test(value) ||
            /\b(and|or|not)\b/.test(value)
        );
    }


    evaluateExpression(expression) {

        const transformed =
            this.transformExpression(
                expression
            );

        return Function(
            ...Object.keys(this.variables),
            `"use strict"; return (${transformed});`
        )(
            ...Object.values(this.variables)
        );
    }


    transformExpression(expression) {

        return expression
            .replace(
                /\bnot\s+/g,
                "!"
            )
            .replace(
                /\band\b/g,
                "&&"
            )
            .replace(
                /\bor\b/g,
                "||"
            );
    }


    /* ---------------------------------------------------------
       VARIABLES
    --------------------------------------------------------- */

    setVariable(
        name,
        value,
        localVariables = null
    ) {

        if (localVariables) {
            localVariables[name] = value;
            return;
        }

        this.variables[name] = value;
    }


    getVariable(
        name,
        localVariables = null
    ) {

        if (
            localVariables &&
            Object.prototype.hasOwnProperty.call(
                localVariables,
                name
            )
        ) {
            return localVariables[name];
        }

        return this.variables[name];
    }


    /* ---------------------------------------------------------
       ASSIGNMENTS
    --------------------------------------------------------- */

    async executeAssignment(
        definition,
        values,
        localVariables
    ) {

        const name = values.name;
        const rawValue = values.value;

        const value =
            this.resolveValue(
                rawValue
            );

        const operator =
            definition.operator || "=";

        const current =
            this.getVariable(
                name,
                localVariables
            );

        let result;

        switch (operator) {

            case "=":
                result = value;
                break;

            case "+=":
                result = current + value;
                break;

            case "-=":
                result = current - value;
                break;

            case "*=":
                result = current * value;
                break;

            case "/=":
                result = current / value;
                break;

            default:
                throw new Error(
                    `Unsupported assignment operator: ${operator}`
                );
        }

        this.setVariable(
            name,
            result,
            localVariables
        );

        return result;
    }


    /* ---------------------------------------------------------
       DOM ELEMENTS
    --------------------------------------------------------- */

    getElement(name) {

        const element =
            document.getElementById(name);

        if (!element) {
            throw new Error(
                `Element not found: ${name}`
            );
        }

        return element;
    }


    async executeElement(
        definition,
        values
    ) {

        const tag =
            definition.tag;

        const name =
            this.resolveElementName(
                values.name
            );

        if (!tag) {
            throw new Error(
                "Element definition has no tag."
            );
        }

        if (!name) {
            throw new Error(
                "Element definition has no name."
            );
        }

        let element =
            document.getElementById(name);

        if (!element) {

            element =
                document.createElement(
                    tag
                );

            element.id = name;

            document.body.appendChild(
                element
            );
        }

        return element;
    }


    resolveElementName(value) {

        const resolved =
            this.resolveValue(value);

        return String(resolved);
    }


    /* ---------------------------------------------------------
       PROPERTIES
    --------------------------------------------------------- */

    async executeProperty(
        definition,
        values
    ) {

        /*
            The native expression stored in syntax.json
            is the source of truth.

            This allows a property to map to any native
            operation without adding that Webly property
            to this runtime.
        */

        const native =
            this.buildNative(
                definition.original,
                values
            );

        if (!native) {
            throw new Error(
                "Property has no native mapping."
            );
        }

        await this.executeJavaScript(
            native
        );
    }


    /* ---------------------------------------------------------
       STYLES
    --------------------------------------------------------- */

    async executeStyle(
        definition,
        values
    ) {

        const element =
            this.getElement(
                this.resolveElementName(
                    values.element
                )
            );

        const property =
            definition.property;

        if (!property) {
            throw new Error(
                "Style definition has no property."
            );
        }

        let value =
            this.resolveValue(
                values.value
            );

        /*
            Special hidden mapping.
        */

        if (
            definition.hiddenValue !== undefined &&
            definition.visibleValue !== undefined
        ) {

            const truthy =
                value === true ||
                value === "true";

            value = truthy
                ? definition.hiddenValue
                : definition.visibleValue;
        }

        /*
            Transform properties need to be constructed
            from their metadata.
        */

        if (definition.transform) {

            const transform =
                definition.transform;

            element.style[property] =
                `${transform}(${value})`;

            return;
        }

        /*
            Unit-bearing properties.
        */

        if (
            definition.unit &&
            typeof value === "number"
        ) {

            value =
                `${value}${definition.unit}`;
        }

        element.style[property] =
            value;
    }


    /* ---------------------------------------------------------
       ACTIONS
    --------------------------------------------------------- */

    async executeAction(
        definition,
        values
    ) {

        const element =
            this.getElement(
                this.resolveElementName(
                    values.element
                )
            );

        const action =
            definition.action;

        const value =
            definition.value;

        if (!action) {
            throw new Error(
                "Action definition has no action."
            );
        }

        if (
            action === "focus" ||
            action === "blur"
        ) {

            const method =
                element[action];

            if (
                typeof method !== "function"
            ) {
                throw new Error(
                    `Element does not support ${action}().`
                );
            }

            method.call(element);
            return;
        }

        this.setObjectPath(
            element,
            action,
            this.resolveValue(
                value
            )
        );
    }


    setObjectPath(
        object,
        path,
        value
    ) {

        const parts =
            path.split(".");

        let target =
            object;

        for (
            let i = 0;
            i < parts.length - 1;
            i++
        ) {

            if (
                target[parts[i]] === undefined ||
                target[parts[i]] === null
            ) {
                target[parts[i]] = {};
            }

            target =
                target[parts[i]];
        }

        target[
            parts[parts.length - 1]
        ] = value;
    }


    /* ---------------------------------------------------------
       EVENTS
    --------------------------------------------------------- */

    async registerEvent(
        definition,
        values,
        body
    ) {

        const element =
            this.getElement(
                this.resolveElementName(
                    values.element
                )
            );

        const event =
            definition.event;

        if (!event) {
            throw new Error(
                "Event definition has no event."
            );
        }

        element.addEventListener(
            event,
            async () => {

                try {

                    await this.executeNodes(
                        body || [],
                        {}
                    );

                } catch (error) {

                    this.reportError(
                        error
                    );
                }
            }
        );
    }


    /* ---------------------------------------------------------
       FUNCTIONS
    --------------------------------------------------------- */

    registerFunction(
        values,
        body
    ) {

        const name =
            values.name;

        this.functions[name] = {
            name,
            body: body || []
        };
    }


    async callFunction(
        values,
        localVariables = {}
    ) {

        const name =
            values.name;

        const fn =
            this.functions[name];

        if (!fn) {
            throw new Error(
                `Webly function not found: ${name}`
            );
        }

        if (
            this.callDepth >=
            this.maxCallDepth
        ) {
            throw new Error(
                `Maximum function call depth exceeded: ${name}`
            );
        }

        this.callDepth++;

        try {

            await this.executeNodes(
                fn.body,
                localVariables
            );

        } finally {

            this.callDepth--;
        }
    }


    /* ---------------------------------------------------------
       CONDITIONS
    --------------------------------------------------------- */

    evaluateCondition(
        condition,
        localVariables
    ) {

        const text =
            String(condition).trim();

        /*
            Build a variable scope that contains locals first,
            then globals.
        */

        const scope = {
            ...this.variables,
            ...(localVariables || {})
        };

        const transformed =
            this.transformExpression(
                text
            );

        try {

            return Boolean(
                Function(
                    ...Object.keys(scope),
                    `"use strict"; return (${transformed});`
                )(
                    ...Object.values(scope)
                )
            );

        } catch {

            const value =
                this.resolveValue(
                    text
                );

            return Boolean(value);
        }
    }


    /* ---------------------------------------------------------
       CONTROL FLOW
    --------------------------------------------------------- */

    async executeControl(
        definition,
        values,
        body,
        localVariables
    ) {

        const control =
            definition.control;

        if (control === "if") {

            return {
                type: "branch",
                matched:
                    this.evaluateCondition(
                        values.condition,
                        localVariables
                    ),
                body
            };
        }

        if (control === "elseIf") {

            return {
                type: "branch",
                matched:
                    this.evaluateCondition(
                        values.condition,
                        localVariables
                    ),
                body
            };
        }

        if (control === "else") {

            return {
                type: "branch",
                matched: true,
                body
            };
        }

        if (control === "while") {

            let iterations = 0;

            while (
                this.evaluateCondition(
                    values.condition,
                    localVariables
                )
            ) {

                iterations++;

                if (
                    iterations >
                    this.maxLoopIterations
                ) {
                    throw new Error(
                        "Maximum loop iterations exceeded."
                    );
                }

                await this.executeNodes(
                    body || [],
                    localVariables
                );

                await this.yield();
            }

            return null;
        }

        if (control === "repeat") {

            const amount =
                Number(
                    this.resolveValue(
                        values.amount
                    )
                );

            if (
                !Number.isFinite(amount)
            ) {
                throw new Error(
                    `Invalid repeat amount: ${values.amount}`
                );
            }

            const count =
                Math.max(
                    0,
                    Math.floor(amount)
                );

            for (
                let i = 0;
                i < count;
                i++
            ) {

                await this.executeNodes(
                    body || [],
                    localVariables
                );

                await this.yield();
            }

            return null;
        }

        if (control === "forever") {

            let iterations = 0;

            while (this.running) {

                iterations++;

                if (
                    iterations >
                    this.maxLoopIterations
                ) {
                    /*
                        A forever loop should normally contain
                        a wait. This safety limit prevents a
                        malformed program from locking the page.
                    */

                    throw new Error(
                        "Forever loop exceeded the runtime safety limit. Add a wait inside the loop."
                    );
                }

                await this.executeNodes(
                    body || [],
                    localVariables
                );

                await this.yield();
            }

            return null;
        }

        throw new Error(
            `Unsupported control operation: ${control}`
        );
    }


    /* ---------------------------------------------------------
       TIMING
    --------------------------------------------------------- */

    async executeTiming(
        definition,
        values,
        body,
        localVariables
    ) {

        const timing =
            definition.timing;

        if (timing === "wait") {

            const seconds =
                Number(
                    this.resolveValue(
                        values.seconds
                    )
                );

            if (
                !Number.isFinite(seconds)
            ) {
                throw new Error(
                    `Invalid wait value: ${values.seconds}`
                );
            }

            await this.sleep(
                Math.max(
                    0,
                    seconds * 1000
                )
            );

            return;
        }

        if (timing === "timeout") {

            const seconds =
                Number(
                    this.resolveValue(
                        values.seconds
                    )
                );

            if (
                !Number.isFinite(seconds)
            ) {
                throw new Error(
                    `Invalid timeout value: ${values.seconds}`
                );
            }

            const capturedBody =
                body || [];

            const capturedLocals =
                localVariables || {};

            setTimeout(
                async () => {

                    try {

                        await this.executeNodes(
                            capturedBody,
                            capturedLocals
                        );

                    } catch (error) {

                        this.reportError(
                            error
                        );
                    }
                },
                Math.max(
                    0,
                    seconds * 1000
                )
            );

            return;
        }

        throw new Error(
            `Unsupported timing operation: ${timing}`
        );
    }


    sleep(milliseconds) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    milliseconds
                )
        );
    }


    yield() {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    0
                )
        );
    }


    /* ---------------------------------------------------------
       NATIVE JAVASCRIPT
    --------------------------------------------------------- */

    async executeNative(
        definition,
        values
    ) {

        const native =
            this.buildNative(
                definition.original,
                values
            );

        if (!native) {
            throw new Error(
                "Native definition has no original mapping."
            );
        }

        await this.executeJavaScript(
            native
        );
    }


    buildNative(
        template,
        values
    ) {

        if (
            typeof template !== "string"
        ) {
            return "";
        }

        let result = template;

        const placeholders =
            this.extractPlaceholders(
                template
            );

        /*
            Replace longest names first.
        */

        const unique =
            [...new Set(placeholders)]
                .sort(
                    (a, b) =>
                        b.length - a.length
                );

        for (const name of unique) {

            const raw =
                values[name];

            const resolved =
                this.resolveValue(
                    raw
                );

            const replacement =
                this.toJavaScriptLiteral(
                    resolved
                );

            result =
                result.replace(
                    new RegExp(
                        "\\{" +
                        this.escapeRegex(name) +
                        "\\}",
                        "g"
                    ),
                    replacement
                );
        }

        /*
            The native mappings in syntax.json use a
            milliseconds placeholder for timing.

            The Webly definition supplies seconds.
        */

        if (
            Object.prototype.hasOwnProperty.call(
                values,
                "seconds"
            )
        ) {

            const seconds =
                Number(
                    this.resolveValue(
                        values.seconds
                    )
                );

            result =
                result.replace(
                    /\{milliseconds\}/g,
                    String(
                        seconds * 1000
                    )
                );
        }

        return result;
    }


    toJavaScriptLiteral(value) {

        if (typeof value === "string") {
            return JSON.stringify(value);
        }

        if (
            typeof value === "number" &&
            Number.isFinite(value)
        ) {
            return String(value);
        }

        if (typeof value === "boolean") {
            return value
                ? "true"
                : "false";
        }

        if (value === null) {
            return "null";
        }

        if (value === undefined) {
            return "undefined";
        }

        return JSON.stringify(value);
    }


    async executeJavaScript(code) {

        const fn =
            new Function(
                `"use strict";\n${code}`
            );

        const result =
            fn();

        if (
            result &&
            typeof result.then === "function"
        ) {
            await result;
        }
    }


    /* ---------------------------------------------------------
       NODE EXECUTION
    --------------------------------------------------------- */

    async executeNodes(
        nodes,
        localVariables = {}
    ) {

        for (
            let index = 0;
            index < nodes.length;
            index++
        ) {

            const node =
                nodes[index];

            /*
                Handle if / else-if / else chains together.
            */

            if (
                node.type === "block"
            ) {

                const match =
                    this.matchDefinition(
                        node.header
                    );

                if (
                    match &&
                    match.definition.type ===
                        "control" &&
                    (
                        match.definition.control ===
                            "if" ||
                        match.definition.control ===
                            "elseIf" ||
                        match.definition.control ===
                            "else"
                    )
                ) {

                    const branchNodes = [];

                    let cursor = index;

                    while (
                        cursor < nodes.length
                    ) {

                        const branch =
                            nodes[cursor];

                        if (
                            branch.type !==
                            "block"
                        ) {
                            break;
                        }

                        const branchMatch =
                            this.matchDefinition(
                                branch.header
                            );

                        if (
                            !branchMatch ||
                            branchMatch.definition.type !==
                                "control" ||
                            ![
                                "if",
                                "elseIf",
                                "else"
                            ].includes(
                                branchMatch.definition.control
                            )
                        ) {
                            break;
                        }

                        branchNodes.push({
                            node: branch,
                            match: branchMatch
                        });

                        cursor++;

                        if (
                            branchMatch.definition.control ===
                            "else"
                        ) {
                            break;
                        }
                    }

                    let alreadyMatched =
                        false;

                    for (const branch of branchNodes) {

                        const control =
                            branch.match.definition.control;

                        let shouldRun = false;

                        if (
                            control === "if" ||
                            control === "elseIf"
                        ) {

                            shouldRun =
                                !alreadyMatched &&
                                this.evaluateCondition(
                                    branch.match.values.condition,
                                    localVariables
                                );

                        } else if (
                            control === "else"
                        ) {

                            shouldRun =
                                !alreadyMatched;
                        }

                        if (shouldRun) {

                            alreadyMatched =
                                true;

                            await this.executeNodes(
                                branch.node.body || [],
                                localVariables
                            );

                            break;
                        }
                    }

                    index =
                        cursor - 1;

                    continue;
                }
            }

            await this.executeNode(
                node,
                localVariables
            );
        }
    }


    async executeNode(
        node,
        localVariables
    ) {

        const header =
            node.header.trim();

        if (!header) {
            return;
        }

        const match =
            this.matchDefinition(
                header
            );

        if (!match) {

            throw new Error(
                `Webly syntax not found: ${header}`
            );
        }

        const definition =
            match.definition;

        const values =
            match.values;

        const type =
            definition.type;

        switch (type) {

            case "element":

                await this.executeElement(
                    definition,
                    values
                );

                break;


            case "property":

                await this.executeProperty(
                    definition,
                    values
                );

                break;


            case "style":

                await this.executeStyle(
                    definition,
                    values
                );

                break;


            case "event":

                await this.registerEvent(
                    definition,
                    values,
                    node.body
                );

                break;


            case "action":

                await this.executeAction(
                    definition,
                    values
                );

                break;


            case "assignment":

                await this.executeAssignment(
                    definition,
                    values,
                    localVariables
                );

                break;


            case "function":

                this.registerFunction(
                    values,
                    node.body
                );

                break;


            case "call":

                await this.callFunction(
                    values,
                    localVariables
                );

                break;


            case "control":

                await this.executeControl(
                    definition,
                    values,
                    node.body,
                    localVariables
                );

                break;


            case "timing":

                await this.executeTiming(
                    definition,
                    values,
                    node.body,
                    localVariables
                );

                break;


            case "native":

                await this.executeNative(
                    definition,
                    values
                );

                break;


            default:

                throw new Error(
                    `Unsupported Webly definition type: ${type}`
                );
        }
    }


    /* ---------------------------------------------------------
       STARTUP
    --------------------------------------------------------- */

    async run(source) {

        try {

            const nodes =
                this.parse(source);

            await this.executeNodes(
                nodes,
                {}
            );

        } catch (error) {

            this.reportError(
                error
            );
        }
    }


    reportError(error) {

        console.error(
            "Webly Runtime Error",
            error
        );

        const message =
            error instanceof Error
                ? error.message
                : String(error);

        let box =
            document.getElementById(
                "__webly_error__"
            );

        if (!box) {

            box =
                document.createElement(
                    "pre"
                );

            box.id =
                "__webly_error__";

            box.style.position =
                "fixed";

            box.style.left =
                "10px";

            box.style.right =
                "10px";

            box.style.bottom =
                "10px";

            box.style.zIndex =
                "2147483647";

            box.style.margin =
                "0";

            box.style.padding =
                "16px";

            box.style.borderRadius =
                "10px";

            box.style.background =
                "#181721";

            box.style.color =
                "#ff6b6b";

            box.style.fontFamily =
                "monospace";

            box.style.whiteSpace =
                "pre-wrap";

            box.style.maxHeight =
                "50vh";

            box.style.overflow =
                "auto";

            document.body.appendChild(
                box
            );
        }

        box.textContent =
            `Webly Runtime Error\n${message}`;
    }
}


/* -------------------------------------------------------------
   FILE LOADING
------------------------------------------------------------- */

async function loadJSON(url) {

    const response =
        await fetch(
            url,
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            `Failed to load ${url}: HTTP ${response.status}`
        );
    }

    return response.json();
}


async function loadText(url) {

    const response =
        await fetch(
            url,
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            `Failed to load ${url}: HTTP ${response.status}`
        );
    }

    return response.text();
}


/* -------------------------------------------------------------
   WEBLY START
------------------------------------------------------------- */

async function startWebly() {

    try {

        const syntax =
            await loadJSON(
                "syntax.json"
            );

        const source =
            await loadText(
                "main.webly"
            );

        const runtime =
            new WeblyRuntime(
                syntax
            );

        window.webly =
            runtime;

        await runtime.run(
            source
        );

    } catch (error) {

        console.error(
            "Webly Startup Error",
            error
        );

        const message =
            error instanceof Error
                ? error.message
                : String(error);

        document.body.textContent =
            `Webly Startup Error\n${message}`;
    }
}


startWebly();
