<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Webly</title>
</head>

<body>

<script>

async function start() {

    const syntax = await fetch("syntax.json?v=2")
        .then(response => response.json());

    const source = await fetch("main.webly")
        .then(response => response.text());

    const runtime = new WeblyRuntime(syntax);

    await runtime.run(source);
}


class WeblyRuntime {

    constructor(syntax) {

        this.syntax = syntax;

        this.definitions = [];

        this.elements = {};
        this.variables = {};
        this.functions = {};

        this.collectDefinitions(
            syntax
        );
    }


    collectDefinitions(
        object,
        path = []
    ) {

        if (
            !object ||
            typeof object !== "object"
        ) {
            return;
        }


        /*
         * Every object containing a Webly
         * definition becomes part of the
         * runtime automatically.
         */

        if (
            typeof object.webly === "string" &&
            typeof object.original === "string"
        ) {

            this.definitions.push({
                path,
                webly: object.webly,
                original: object.original
            });
        }


        for (
            const key of Object.keys(object)
        ) {

            if (
                key === "webly" ||
                key === "original"
            ) {
                continue;
            }

            this.collectDefinitions(
                object[key],
                [...path, key]
            );
        }
    }


    async run(source) {

        const statements =
            this.parseBlocks(source);

        for (
            const statement of statements
        ) {

            await this.execute(
                statement
            );
        }
    }


    parseBlocks(source) {

        const statements = [];

        let current = "";
        let depth = 0;

        for (
            const line of source.split("\n")
        ) {

            if (
                !line.trim()
            ) {
                continue;
            }

            current +=
                (current ? "\n" : "") +
                line;

            for (
                const character of line
            ) {

                if (
                    character === "{"
                ) {
                    depth++;
                }

                if (
                    character === "}"
                ) {
                    depth--;
                }
            }

            if (
                depth === 0
            ) {

                statements.push(
                    current.trim()
                );

                current = "";
            }
        }

        if (
            current.trim()
        ) {

            statements.push(
                current.trim()
            );
        }

        return statements;
    }


    async execute(statement) {

        const definition =
            this.findDefinition(
                statement
            );

        if (!definition) {

            return;
        }


        const values =
            this.extractValues(
                statement,
                definition.webly
            );

        if (!values) {

            return;
        }


        await this.executeDefinition(
            definition,
            values,
            statement
        );
    }


    findDefinition(source) {

        for (
            const definition
            of this.definitions
        ) {

            const pattern =
                this.createPattern(
                    definition.webly
                );

            if (
                pattern.test(
                    source.trim()
                )
            ) {

                return definition;
            }
        }

        return null;
    }


    extractValues(
        source,
        template
    ) {

        const pattern =
            this.createPattern(
                template
            );

        const match =
            source.trim().match(
                pattern
            );

        if (!match) {

            return null;
        }

        return match.slice(1);
    }


    createPattern(template) {

        /*
         * Convert syntax.json's placeholders
         * into generic captures.
         *
         * syntax.json controls the syntax.
         */

        let pattern = "";

        let index = 0;

        while (
            index < template.length
        ) {

            if (
                template[index] === "{"
            ) {

                const end =
                    template.indexOf(
                        "}",
                        index
                    );

                if (
                    end !== -1
                ) {

                    pattern +=
                        "(.+?)";

                    index =
                        end + 1;

                    continue;
                }
            }


            const character =
                template[index];

            pattern +=
                character.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );

            index++;
        }

        return new RegExp(
            "^" +
            pattern +
            "$"
        );
    }


    async executeDefinition(
        definition,
        values,
        source
    ) {

        /*
         * The definition's native syntax
         * determines what kind of operation
         * must happen.
         */

        const native =
            definition.original;


        /*
         * HTML creation
         */

        if (
            native.startsWith("<")
        ) {

            this.createElement(
                native,
                values
            );

            return;
        }


        /*
         * JavaScript execution
         *
         * The native representation from
         * syntax.json is executed rather than
         * a hardcoded Webly keyword.
         */

        const code =
            this.resolve(
                native,
                values
            );


        await this.executeNative(
            code
        );
    }


    createElement(
        template,
        values
    ) {

        const tagMatch =
            template.match(
                /<([A-Za-z][\w-]*)/
            );

        if (!tagMatch) {

            return;
        }

        const tag =
            tagMatch[1];

        const element =
            document.createElement(
                tag
            );


        const idMatch =
            template.match(
                /id=["']([^"']+)["']/
            );

        if (
            idMatch
        ) {

            const id =
                this.resolveValue(
                    idMatch[1],
                    values
                );

            element.id = id;

            this.elements[id] =
                element;
        }


        document.body.appendChild(
            element
        );
    }


    resolve(
        template,
        values
    ) {

        let result =
            template;

        let index = 0;

        while (
            index < values.length
        ) {

            result =
                result.replace(
                    /\{[^}]+\}/,
                    this.resolveValue(
                        values[index],
                        values
                    )
                );

            index++;
        }

        return result;
    }


    resolveValue(
        value,
        values
    ) {

        if (
            typeof value !== "string"
        ) {

            return value;
        }


        const trimmed =
            value.trim();


        if (
            (
                trimmed.startsWith('"') &&
                trimmed.endsWith('"')
            ) ||
            (
                trimmed.startsWith("'") &&
                trimmed.endsWith("'")
            )
        ) {

            return trimmed.slice(
                1,
                -1
            );
        }


        if (
            trimmed === "true"
        ) {

            return true;
        }


        if (
            trimmed === "false"
        ) {

            return false;
        }


        if (
            !Number.isNaN(
                Number(trimmed)
            )
        ) {

            return Number(
                trimmed
            );
        }


        if (
            trimmed in this.variables
        ) {

            return this.variables[
                trimmed
            ];
        }


        return trimmed;
    }


    async executeNative(
        code
    ) {

        /*
         * Native JavaScript is generated
         * from syntax.json.
         */

        const runtime =
            this;

        const fn =
            new Function(
                "runtime",
                `
                    "use strict";

                    ${code}
                `
            );

        return await fn(
            runtime
        );
    }
}


start().catch(
    error => {

        console.error(
            "Webly Runtime Error:",
            error
        );
    }
);

</script>

</body>
</html>
